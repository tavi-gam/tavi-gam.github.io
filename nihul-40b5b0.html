<style>

const CHAINS=[['רמי לוי',1667.53],['אושר עד',1667.53*3151.83/3127.49,1],['נטו חסכון',1667.53*3157.17/3127.49,1],['יוחננוף',1729.20],['קרפור היפר',1743.70],['מחסני השוק',1797.21],['סלאח דבאח',1868.41],['ויקטורי',1875.18],['קשת טעמים',1955.53],['יוניברס',1987.87],['שופרסל דיל',2038.18],['טיב טעם',2243.04]];
const OTHER=['שופרסל שלי','יש חסד','חצי חינם','קרפור מרקט','קינג סטור','סופר שכונתי','רשת אחרת'];
const SB_URL='https://iqspnyespxskqrznpvcz.supabase.co',SB_KEY='sb_publishable_XZF0tC5GMduD2LHvZ70D5g_9eUZs9vi';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>'₪'+(+v).toFixed(2);
const toast=t=>{const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)};
let CODE='',chan=null;
const rpc=async(fn,args)=>{const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});
 if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):null};
const getDoc=p=>rpc('shop_get_doc',{code:CODE,p});
const putDoc=async(p,d)=>{await rpc('shop_put',{code:CODE,p,d});try{chan&&chan.send({type:'broadcast',event:'chg',payload:{t:Date.now()}})}catch(e){}};
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
while(CAT.length<AISLES.length)CAT.push([]);
const ALLN=[];const IDX={};CAT.forEach((l,i)=>l.forEach(n=>{IDX[n]=i;ALLN.push(n)}));
const CHN=CHAINS.map(c=>c[0]).concat(OTHER);

async function login(code,pass){
 const ok=await rpc('shop_admin_check',{code,pass});if(!ok)return false;
 CODE=code;try{sessionStorage.setItem('tg-adm',JSON.stringify({code,pass}))}catch(e){}
 try{if(window.supabase){const sb=window.supabase.createClient(SB_URL,SB_KEY);chan=sb.channel('shop-'+await sha('shop:'+code.toLowerCase().trim()));chan.subscribe()}}catch(e){}
 $('login').hidden=true;$('app').hidden=false;$('famcode').textContent='משפחה: '+code;init();return true}
$('lform').addEventListener('submit',async e=>{e.preventDefault();$('lerr').textContent='';
 try{if(!await login($('lcode').value.trim(),$('lpass').value))$('lerr').textContent='הקוד או הסיסמה לא נכונים (אחרי 5 ניסיונות נועל ל־15 דקות)'}catch(err){$('lerr').textContent='אין חיבור. נסו שוב'}});
$('logout').onclick=()=>{try{sessionStorage.removeItem('tg-adm')}catch(e){}location.reload()};
(async()=>{try{const qc=new URLSearchParams(location.search).get('code'),sup=sessionStorage.getItem('tg-sup');
 if(qc&&sup){history.replaceState(null,'',location.pathname);if(await login(qc,sup))return}
 const s=JSON.parse(sessionStorage.getItem('tg-adm'));if(s)await login(s.code,s.pass)}catch(e){}})();

document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));
 ['prices','cat','msg'].forEach(t=>$('t-'+t).hidden=t!==b.dataset.t)});

/* ---------- prices ---------- */
let PR={m:{},c:{}},CUR=null,CATD={items:[]};
async function loadPrices(){const d=await getDoc('settings/prices');PR=d&&typeof d==='object'?d:{};PR.m=PR.m||{};PR.c=PR.c||{};plist()}
function chain(){return $('chain').value}
function plist(){const ch=chain();$('chn').textContent=ch;const o=PR.c[ch]||{};const ks=Object.keys(o).sort((a,b)=>a.localeCompare(b,'he'));
 $('plist').innerHTML=ks.map(n=>{const e=o[n],sl=e.s&&e.u>Date.now();return `<tr><td>${esc(n)}</td><td>${e.p?money(e.p):'—'}</td><td>${sl?`<span class="sale">${money(e.s)}</span> <span class="mut">עד ${new Date(e.u).toLocaleDateString('he-IL')}</span>`:'—'}</td><td><button class="ghost sm" data-e="${esc(n)}">עריכה</button></td></tr>`}).join('');
 $('pempty').textContent=ks.length?'':'עוד אין מחירים שמורים ברשת הזו.'}
$('plist').addEventListener('click',e=>{const b=e.target.closest('[data-e]');if(b){pick(b.dataset.e);scrollTo({top:0,behavior:'smooth'})}});
$('chain').addEventListener('change',()=>{plist();if(CUR)pick(CUR)});
$('pq').addEventListener('input',()=>{const q=$('pq').value.trim();if(q.length<2){$('pres').hidden=true;return}
 const names=ALLN.concat((CATD.items||[]).map(x=>x.n)).filter((n,i,a)=>a.indexOf(n)===i&&n.includes(q)).slice(0,40);
 $('pres').innerHTML=names.map(n=>`<button type="button" data-n="${esc(n)}"><span>${esc(n)}</span><span class="mut">${esc(AISLES[IDX[n]]??'שלנו')}</span></button>`).join('')||'<div class="mut" style="padding:10px">לא נמצא. אפשר להוסיף אותו בלשונית ⭐ מוצרים</div>';
 $('pres').hidden=false});
$('pres').addEventListener('click',e=>{const b=e.target.closest('[data-n]');if(b){pick(b.dataset.n);$('pres').hidden=true;$('pq').value=''}});
function pick(n){CUR=n;const e=(PR.c[chain()]||{})[n]||{};$('pedit').hidden=false;$('pname').textContent=n;
 $('pcur').textContent=e.p||e.s?'':(PR.m[n]?`מחיר כללי שמור: ${money(PR.m[n])}`:'אין עדיין מחיר שמור ברשת הזו');
 $('pp').value=e.p||'';const sl=e.s&&e.u>Date.now();$('ps').value=sl?e.s:'';
 $('pu').value=new Date(sl?e.u:Date.now()+6*864e5).toISOString().slice(0,10)}
const num=x=>{const v=parseFloat(String(x).replace(',','.'));return v>0&&v<10000?Math.round(v*100)/100:0};
$('psave').onclick=async()=>{if(!CUR)return;const p=num($('pp').value),s=num($('ps').value);
 if(!p&&!s){toast('הקלידו מחיר');return}
 let u=0;if(s){u=new Date($('pu').value+'T23:59:59').getTime();if(!(u>Date.now())){toast('תאריך סיום המבצע צריך להיות בעתיד');return}}
 try{await loadPrices();const ch=chain();PR.c[ch]=PR.c[ch]||{};const o={};if(p)o.p=p;if(s){o.s=s;o.u=u}PR.c[ch][CUR]=o;
  await putDoc('settings/prices',PR);plist();toast(`נשמר: ${CUR} ב${ch}`)}catch(e){toast('השמירה נכשלה')}};
$('pclear').onclick=async()=>{if(!CUR)return;try{await loadPrices();const ch=chain();if(PR.c[ch])delete PR.c[ch][CUR];await putDoc('settings/prices',PR);plist();pick(CUR);toast('המחיר נמחק')}catch(e){toast('המחיקה נכשלה')}};

/* ---------- catalog ---------- */
async function loadCat(){const d=await getDoc('settings/catalog');CATD=d&&Array.isArray(d.items)?d:{items:[]};clist()}
const aisleOpts=sel=>AISLES.map((a,i)=>`<option value="${i}"${i===sel?' selected':''}>${esc(a)}</option>`).join('');
function clist(){const it=CATD.items;
 $('clist').innerHTML=it.map((x,i)=>`<tr><td><input value="${esc(x.n)}" data-i="${i}" class="cn" maxlength="40" style="min-height:38px"></td><td><select data-i="${i}" class="cc" style="min-height:38px">${aisleOpts(x.c)}</select></td><td><button class="ghost sm" data-del="${i}">🗑️</button></td></tr>`).join('');
 $('cempty').textContent=it.length?'אפשר לשנות שם או מחלקה, והשינוי נשמר מיד.':'עוד לא נוספו מוצרים.'}
async function saveCat(msg){try{await putDoc('settings/catalog',{items:CATD.items});clist();toast(msg)}catch(e){toast('השמירה נכשלה');loadCat()}}
$('clist').addEventListener('change',e=>{const i=+e.target.dataset.i;if(isNaN(i))return;
 if(e.target.classList.contains('cn')){const v=e.target.value.trim().replace(/\s+/g,' ').slice(0,40);if(v.length<2){toast('שם קצר מדי');clist();return}
  if(IDX[v]!=null||CATD.items.some((x,j)=>j!==i&&x.n===v)){toast('השם כבר קיים בקטלוג');clist();return}CATD.items[i].n=v;saveCat('השם עודכן')}
 else{CATD.items[i].c=+e.target.value;saveCat('המחלקה עודכנה')}});
$('clist').addEventListener('click',e=>{const b=e.target.closest('[data-del]');if(!b)return;
 if(!b.dataset.arm){b.dataset.arm=1;b.textContent='למחוק?';return}const n=CATD.items[+b.dataset.del].n;CATD.items.splice(+b.dataset.del,1);saveCat(`${n} נמחק`)});
$('nadd').onclick=async()=>{const n=$('nn').value.trim().replace(/\s+/g,' ').slice(0,40);if(n.length<2){toast('הקלידו שם');return}
 await loadCat();if(IDX[n]!=null||CATD.items.some(x=>x.n===n)){toast('כבר קיים בקטלוג');return}
 CATD.items.push({n,c:+$('nc').value});$('nn').value='';saveCat(`⭐ ${n} נוסף`)};

/* ---------- message ---------- */
async function loadMsg(){const d=await getDoc('settings/announce');if(d&&d.t&&d.body){$('mlast').hidden=false;
 $('mlastb').innerHTML=`<b>${esc(d.title||'')}</b><div style="white-space:pre-wrap">${esc(d.body)}</div><div class="mut">${new Date(d.t).toLocaleString('he-IL')}</div>`}else $('mlast').hidden=true}
$('msend').onclick=async()=>{const title=$('mt').value.trim()||'הודעה',body=$('mb').value.trim();if(!body){toast('כתבו תוכן להודעה');return}
 try{await putDoc('settings/announce',{t:Date.now(),title,body});
  if($('mpush').checked)await fetch(SB_URL+'/functions/v1/shop-push',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:CODE,from:'admin',title:'📢 '+title,body,tag:'announce'})});
  $('mt').value='';$('mb').value='';loadMsg();toast('ההודעה נשלחה לכולם')}catch(e){toast('השליחה נכשלה')}};
$('mdel').onclick=async()=>{try{await putDoc('settings/announce',{t:0});loadMsg();toast('הבאנר הוסר')}catch(e){toast('נכשל')}};

/* theme */
let TH='light';try{TH=localStorage.getItem('tg-adm-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}
function theme(t){TH=t;document.documentElement.dataset.theme=t;$('theme').textContent=t==='dark'?'☀️ בהיר':'🌙 כהה';try{localStorage.setItem('tg-adm-theme',t)}catch(e){}}
$('theme').onclick=()=>theme(TH==='dark'?'light':'dark');theme(TH);
function init(){$('chain').innerHTML=CHN.map(c=>`<option>${esc(c)}</option>`).join('');$('nc').innerHTML=aisleOpts(AISLES.length-1);
 loadPrices().catch(()=>toast('טעינת המחירים נכשלה'));loadCat().catch(()=>{});loadMsg().catch(()=>{})}
</script></body></html>
