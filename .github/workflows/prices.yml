name: prices
on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'
permissions:
  contents: write
concurrency: prices
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: probe
        run: |
          pip install il-supermarket-scraper 2>&1 | tail -3
          python - <<'PY'
          import inspect, il_supermarket_scarper as m
          from il_supermarket_scarper.scrappers_factory import ScraperFactory
          print('START', inspect.signature(m.ScarpingTask.start))
          c=ScraperFactory.get('RAMI_LEVY') if hasattr(ScraperFactory,'get') else ScraperFactory.RAMI_LEVY.value
          print('CLS', c)
          print('SCRAPE', inspect.signature(c.scrape))
          print('INIT', inspect.signature(c.__init__))
          print(inspect.getsource(m.ScarpingTask)[:3000])
          PY
